<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:560px;overflow:hidden}
body{background:#f7f1e8;font-family:Georgia,"Times New Roman",serif;color:#2b1d12;display:flex;align-items:center}
.wrap{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 96px;box-sizing:border-box;gap:64px}
.left{display:flex;align-items:center;gap:40px;flex:1}
svg.logo{width:180px;height:180px;flex:none;filter:drop-shadow(0 10px 24px rgba(125,67,23,.28))}
h1{font-size:76px;line-height:1.02;margin:0 0 18px;letter-spacing:-1px;color:#7d4317}
p{font-size:30px;line-height:1.35;margin:0;color:#4a3626;max-width:520px}
p strong{color:#9a5520}
.card{flex:none;width:430px;background:#fffdf8;border:2px solid #e3d3bf;border-radius:22px;padding:30px 30px 26px;box-shadow:0 18px 40px rgba(60,35,10,.12)}
.step{display:flex;align-items:center;gap:18px;padding:12px 0}
.mark{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:700 22px/1 Georgia,serif}
.done .mark{background:#e3f1e6;border:2.5px solid #2f6b3b}
.done .mark svg{width:24px;height:24px}
.now .mark{border:3px solid #9a5520;color:#7d4317;box-shadow:0 0 0 5px #f3e6d6}
.label{font-size:27px;font-weight:700;color:#2b1d12}
.done .label{color:#2b1d12}
.sub{font-size:19px;color:#6b665c;margin-top:2px;font-weight:400}
.btn{margin:10px 0 0 64px;display:inline-block;background:linear-gradient(135deg,#9a5520,#7d4317);color:#fff;font:700 22px/1 Georgia,serif;padding:14px 22px;border-radius:12px}
</style></head><body><div class="wrap">
<div class="left">
<svg class="logo" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5520"/><stop offset="1" stop-color="#7d4317"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8.5" width="18" height="16" rx="2.5"/><path d="M7 13h18M12 6.5v4M20 6.5v4"/><path d="M12 18.5l2.6 2.6 5.4-5.3"/></g></svg>
<div><h1>Scheduler<br>Helper</h1>
<p>Your class list from Canvas into Scheduler, in <strong>one click</strong>. Any school's Canvas. Keeps nothing.</p></div>
</div>
<div class="card">
<div class="step done"><span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2f6b3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><div class="label">Add Scheduler Helper</div></div></div>
<div class="step done"><span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="#2f6b3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><div class="label">Import your class list</div><div class="sub">Pick the class: 57 students, in.</div></div></div>
<div class="step now"><span class="mark">3</span><div><div class="label">All done! Delete it?</div></div></div>
<span class="btn">Delete Scheduler Helper</span>
</div>
</div></body></html>
